<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5.1 長いチャットで起きること（新しい形の試作）</title>
<style>
:root{
  --ink:#1c2430; --muted:#55606e;
  --line:#d5dce4; --line-strong:#8e9bab;
  --accent:#146856; --accent-d:#14532d;
  --gold:#c8a24a; --gold-d:#7a5c14; --red:#d05545;
  --fur:#b08954; --fur-d:#96703f; --fur-l:#dec39c;
  --mint:#79cfa9; --mint-d:#4faf86;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff}
.wrap{max-width:920px;margin:0 auto;padding:0 10px}

/* ===== stage base (same layout rules as the v13 fullscreen engine) ===== */
.fsstage{--fs-durfactor:2}
.fsunit{display:flex;flex-direction:column;height:100vh;height:100svh;height:100dvh}
.fsunit > h3{flex:0 0 auto;margin:.8rem 0 .55rem;font-size:clamp(20px,5.6vw,28px);font-weight:900;line-height:1.35}
.fsunit > h3 .no{color:var(--accent);margin-right:.35em}
.fsunit .fsstage{flex:1 1 auto;min-height:0;display:flex}
.fs-screen{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#fdfdf8;border-top:2.5px solid var(--line);border-bottom:2.5px solid var(--line);box-shadow:0 6px 18px rgba(60,50,20,.10)}
.fs-scenes{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:linear-gradient(180deg,#eafaf1 0%,#fdfdf8 76%,#e7dcc8 76.2%,#e7dcc8 100%)}
.fs-tag{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:15px;border-radius:999px;padding:4px 14px}
.fs-pillrow{flex:0 0 auto;width:100%;padding:10px 12px 2px;text-align:left}
.fs-center{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fs-scene{position:absolute;inset:0;padding:0;display:flex;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none;overflow:hidden}
.fs-scene.on{visibility:visible;opacity:1}
.fs-fit{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0;width:100%;transform-origin:center center}
.fs-fit > *{max-width:100%}
.fs-telop{flex:0 0 auto;background:rgba(18,38,28,.95);color:#fff;font-weight:800;font-size:clamp(16px,2.2vw,24px);line-height:1.5;padding:.7em 1em;overflow-wrap:break-word}
@media(max-width:900px){ .fs-fit{padding:12px 0;gap:10px} .fs-telop{font-size:15px;line-height:1.45;padding:12px 14px} }

/* ===== Kappie: flat illustration (round young capybara + mint sweater) ===== */
.kap{width:clamp(104px,32vw,168px);height:auto;flex:0 0 auto}
.kap .kap-ear{fill:var(--fur-d)} .kap .kap-earin{fill:var(--fur-l)}
.kap .kap-body{fill:var(--fur)} .kap .kap-muzzle{fill:var(--fur-l)}
.kap .kap-nose{fill:#8a6a42}
.kap .kap-sweater{fill:var(--mint)} .kap .kap-collar{fill:none;stroke:var(--mint-d);stroke-width:9;stroke-linecap:round}
.kap .kap-cheek{fill:#f2a7a7;opacity:.55} .kap .kap-foot{fill:var(--fur-d)}
.kap .kap-sweat{fill:#7db8e8}
.kap .ke circle{fill:#2e2118} .kap .ke .khl{fill:#fff}
.kap .ke path{fill:none;stroke:#2e2118;stroke-width:5.5;stroke-linecap:round}
.kap .km{fill:none;stroke:#5d4028;stroke-width:5;stroke-linecap:round}
.kap .km-happy{fill:#8a5632;stroke:none}
.kap .ke,.kap .km,.kap .kap-sweat{display:none}
.kap.mood-normal .ke-open,.kap.mood-normal .km-normal{display:block}
.kap.mood-tired  .ke-tired,.kap.mood-tired  .km-tired,.kap.mood-tired .kap-sweat{display:block}
.kap.mood-happy  .ke-happy,.kap.mood-happy  .km-happy{display:block}
.kap.mood-puz    .ke-puz,   .kap.mood-puz    .km-puz{display:block}
.kap.tilt{transform:rotate(-6deg)}

/* ===== shared proto props ===== */
.p-row{display:flex;gap:10px;width:100%;max-width:min(94%,600px);align-items:center;justify-content:center}
.p-card{background:#fff;border:2.5px solid var(--line);border-radius:16px;box-shadow:0 6px 16px rgba(60,50,20,.13)}
.p-meter{width:100%;max-width:min(94%,600px);height:30px;background:#fff;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.p-meter i{display:block;height:100%;width:88%;background:linear-gradient(90deg,#e0a83c,#d05545)}
.p-file{display:inline-flex;align-items:center;gap:8px;background:#f4faf7;border:2.5px solid var(--accent);border-radius:10px;padding:.45em .8em;font-weight:800;font-size:clamp(15px,4.9vw,22px);color:var(--ink)}
.p-file .tab{width:26px;height:12px;border-radius:4px 8px 0 0;background:var(--gold);flex:0 0 auto}
@keyframes pspin{to{transform:rotate(360deg)}}
.p-spin{animation:pspin 5s linear infinite;transform-origin:center}
@keyframes ppulse{0%,100%{box-shadow:0 0 0 0 rgba(200,162,74,.0)}50%{box-shadow:0 0 0 10px rgba(200,162,74,.28)}}
.p-pulse{animation:ppulse 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .p-spin,.p-pulse{animation:none} }

/* S1 chat mock: empty bubbles only (shapes, no text) */
.p-chat{flex:1 1 auto;min-width:0;padding:10px}
.p-bub{height:25px;border-radius:12px;margin-bottom:7px}
.p-bub:last-child{margin-bottom:0}
.p-bub.u{background:var(--accent);margin-left:16%}
.p-bub.m{background:#eef3f0;margin-right:16%}
.fsstage.fs-live .bubseq .p-bub{display:none}
.fsstage.fs-live .bubseq .p-bub.shown{display:block;animation:pBubIn calc(.5s * var(--fs-durfactor,1)) ease both}
@keyframes pBubIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fsstage.fs-measuring .bubseq .p-bub{display:block!important;animation:none!important}

/* S2 shelf */
.p-shelf{width:100%;max-width:min(94%,600px);border:3px dashed var(--accent);border-radius:16px;background:rgba(255,255,255,.55);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:14px}
.p-shelf-items{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap}

/* S3 token blocks */
.p-tokbar{display:flex;gap:3px;width:100%;max-width:min(94%,560px);justify-content:center}
.p-tok{flex:1 1 0;max-width:52px;height:44px;background:#fff;border:3px solid var(--accent);border-radius:10px;position:relative;box-shadow:0 3px 8px rgba(60,50,20,.12)}
.p-tok::before,.p-tok::after{content:"";position:absolute;left:8px;right:8px;height:5px;border-radius:3px;background:#c9d8cf}
.p-tok::before{top:11px}.p-tok::after{top:24px}
.p-plus{font-weight:900;color:var(--accent-d);font-size:clamp(22px,6vw,34px);line-height:1}

/* S4 pc mock */
.p-pc{width:100%;max-width:min(94%,600px);padding:12px 14px 14px}
.p-pc-top{display:flex;gap:6px;margin-bottom:10px}
.p-pc-top i{width:11px;height:11px;border-radius:50%;background:#d8dee6}
.p-pc-top i:first-child{background:#e8a09a}.p-pc-top i:nth-child(2){background:#ecd28a}.p-pc-top i:nth-child(3){background:#a8d5ba}
.p-line{height:13px;border-radius:6px;background:#e3e9e4;margin-bottom:8px}
.p-flow{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 2px 4px}
.p-flow .grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.p-flow .lab{font-family:ui-monospace,monospace;font-weight:800;font-size:clamp(15px,4.6vw,21px)}
.p-flow .lab.in{color:#146856}.p-flow .lab.out{color:#b3541e}
.p-mini{width:30px;height:38px;background:#fff;border:2px solid #b9cdc0;border-radius:5px;box-shadow:0 2px 5px rgba(60,50,20,.15)}
.p-usage{font-family:ui-monospace,monospace;font-weight:800;font-size:clamp(21px,7.2vw,36px);color:var(--ink);border-top:2px solid var(--line);padding-top:.45em;text-align:center;overflow-wrap:break-word}
.p-usage .in{color:#146856}.p-usage .out{color:#b3541e}

/* S5 scroll + jar */
.p-scrollwrap{width:100%;max-width:min(94%,600px);display:flex;align-items:center;gap:10px}
.p-scroll{height:56px;width:110px;background:#fff;border:2.5px solid #b9cdc0;border-radius:10px;box-shadow:0 4px 10px rgba(60,50,20,.13);position:relative;flex:0 0 auto}
.p-scroll::after{content:"";position:absolute;right:-9px;top:-4px;width:16px;height:62px;border-radius:8px;background:#e7dcc8;border:2px solid #cbbfa5}
.p-jar{position:relative;width:104px;height:128px;flex:0 0 auto;border:3.5px solid var(--line-strong);border-top-width:8px;border-radius:12px 12px 20px 20px;background:rgba(255,255,255,.65);overflow:hidden}
.p-jar .fill{position:absolute;left:0;right:0;bottom:0;height:6%;background:linear-gradient(180deg,#f0cd72,#e0a83c)}
.p-coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#ffe9a8,#e9b949 62%,#c9932c);border:2px solid #c9932c;opacity:0}
.p-docfall{display:flex;gap:16px;align-items:center;justify-content:center}
.p-docbig{width:52px;height:66px;background:#fff;border:3px solid #8aa79a;border-radius:8px;box-shadow:0 5px 12px rgba(60,50,20,.14);position:relative}
.p-docbig::before{content:"";position:absolute;left:8px;right:8px;top:14px;height:6px;border-radius:3px;background:#c9d8cf;box-shadow:0 13px 0 #c9d8cf,0 26px 0 #c9d8cf}
.p-sheetlong{height:34px;width:0;background:#fff;border:2.5px solid #b9cdc0;border-radius:8px;box-shadow:0 3px 8px rgba(60,50,20,.12)}

/* S6 buried star sheet */
.p-stackzone{position:relative;width:min(76%,330px);height:238px;flex:0 0 auto}
.p-sheet{position:absolute;left:0;width:100%;height:42px;background:#fff;border:2px solid #b9cdc0;border-radius:8px;box-shadow:0 2px 6px rgba(60,50,20,.12)}
.p-sheet.star{background:#fdf6e0;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center}
.p-sheet.star b{color:var(--gold);font-size:26px;line-height:1}
.p-mag{position:absolute;width:54px;height:54px;right:-8px;top:6px}

/* S8 props: ruler / calendar / signs */
.p-prop{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid var(--line);border-radius:14px;box-shadow:0 5px 12px rgba(60,50,20,.12);padding:10px}
.p-ruler{width:170px;height:40px;background:repeating-linear-gradient(90deg,#fdf6e0 0 16px,#f3e9c8 16px 17px);border:2.5px solid var(--gold);border-radius:8px}
.p-cal{width:86px;height:76px;border:2.5px solid var(--line-strong);border-radius:10px;background:linear-gradient(180deg,#e88f84 0 20px,#fff 20px);position:relative}
.p-cal::after{content:"";position:absolute;left:10px;right:10px;top:32px;height:6px;border-radius:3px;background:#d8dee6;box-shadow:0 14px 0 #d8dee6,0 28px 0 #d8dee6}
.p-q{position:absolute;right:-12px;top:-14px;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(60,50,20,.25)}
.p-signs{display:flex;gap:10px;width:100%;max-width:min(94%,600px)}
.p-sign{flex:1 1 0;min-width:0;height:104px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 12px rgba(60,50,20,.12)}
.p-sign.lit{border-color:var(--accent)}
.p-sign .bub2{width:34px;height:24px;border-radius:10px;background:#eef3f0;border:2px solid #b9cdc0;position:relative}
.p-sign .bub2 + .bub2{margin-left:-8px;margin-top:22px;background:var(--accent);border-color:var(--accent)}
.p-sign .doc{width:44px;height:56px;background:#fff;border:2.5px solid #b9cdc0;border-radius:6px;position:relative}
.p-sign .doc::before{content:"";position:absolute;left:7px;right:7px;top:10px;height:5px;border-radius:3px;background:#c9d8cf;box-shadow:0 11px 0 #c9d8cf}
.p-sign .x{position:absolute;right:-9px;bottom:-9px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}
.p-sign .stardoc{width:44px;height:56px;background:#fdf6e0;border:2.5px solid var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative}
.p-sign .stardoc b{color:var(--gold);font-size:22px}
.p-sign .no{position:absolute;right:-11px;bottom:-11px;width:28px;height:28px}

/* S9 / S10 */
.p-stackmini{position:relative;width:104px;height:118px;flex:0 0 auto}
.p-stackmini .p-sheet{height:30px}
.p-win{position:relative;width:150px;height:118px;flex:0 0 auto;background:#fff;border:3px solid var(--accent);border-radius:16px;box-shadow:0 7px 16px rgba(60,50,20,.13);padding:12px}
.p-win .obub{height:26px;border-radius:10px;border:2.5px dashed #b9cdc0;margin-right:26%}
.p-arrow{font-weight:900;color:var(--accent-d);font-size:clamp(24px,7vw,38px);line-height:1;flex:0 0 auto}
.p-spark{color:#e5a83c;font-weight:900;font-size:clamp(22px,6vw,36px);line-height:1}
@media print{.fsunit{height:auto}.fs-scene{position:static;visibility:hidden;display:none}.fs-scene.fs-final{visibility:visible;display:flex}.fs-fit{transform:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="fsunit">
<h3><span class="no">5.1</span>長いチャットで起きること</h3>
<div class="fsstage" data-fs="proto51"><div class="fs-screen">
<div class="fs-scenes">

<!-- S1 (a): bubbles pile up, Kappie tires, meter drains -->
<div class="fs-scene p1 on"><div class="fs-pillrow"><span class="fs-tag">5.1</span></div><div class="fs-center"><div class="fs-fit">
  <div class="p-row">
    <div class="p-card p-chat bubseq">
      <div class="p-bub u" style="width:84%"></div>
      <div class="p-bub m" style="width:76%"></div>
      <div class="p-bub u" style="width:62%"></div>
      <div class="p-bub m" style="width:80%"></div>
      <div class="p-bub u" style="width:70%"></div>
      <div class="p-bub m" style="width:58%"></div>
      <div class="p-bub u" style="width:78%"></div>
      <div class="p-bub m" style="width:66%"></div>
    </div>
    <svg class="kap mood-normal" viewBox="0 0 220 190" aria-hidden="true">
      <ellipse class="kap-foot" cx="76" cy="182" rx="16" ry="7"/><ellipse class="kap-foot" cx="144" cy="182" rx="16" ry="7"/>
      <rect class="kap-ear" x="46" y="16" width="30" height="30" rx="12"/><rect class="kap-ear" x="144" y="16" width="30" height="30" rx="12"/>
      <rect class="kap-earin" x="54" y="24" width="14" height="14" rx="6"/><rect class="kap-earin" x="152" y="24" width="14" height="14" rx="6"/>
      <ellipse class="kap-body" cx="110" cy="106" rx="90" ry="74"/>
      <ellipse class="kap-sweater" cx="23" cy="126" rx="12" ry="21"/><ellipse class="kap-sweater" cx="197" cy="126" rx="12" ry="21"/>
      <path class="kap-sweater" d="M22 116 Q110 144 198 116 L192 158 Q110 182 28 158 Z"/>
      <ellipse class="kap-muzzle" cx="110" cy="128" rx="44" ry="29"/>
      <path class="kap-collar" d="M58 100 Q110 120 162 100"/>
      <ellipse class="kap-nose" cx="110" cy="116" rx="13" ry="8"/>
      <ellipse class="kap-cheek" cx="46" cy="110" rx="11" ry="7"/><ellipse class="kap-cheek" cx="174" cy="110" rx="11" ry="7"/>
      <g class="ke ke-open"><circle cx="70" cy="86" r="8"/><circle cx="150" cy="86" r="8"/><circle class="khl" cx="73" cy="83" r="2.6"/><circle class="khl" cx="153" cy="83" r="2.6"/></g>
      <g class="ke ke-tired"><path d="M60 88 Q70 94 80 88"/><path d="M140 88 Q150 94 160 88"/><path d="M60 79 h20"/><path d="M140 79 h20"/></g>
      <g class="ke ke-happy"><path d="M60 90 Q70 78 80 90"/><path d="M140 90 Q150 78 160 90"/></g>
      <g class="ke ke-puz"><circle cx="70" cy="86" r="8"/><circle class="khl" cx="73" cy="83" r="2.6"/><path d="M140 90 Q150 80 160 90"/><path d="M57 70 Q70 63 83 70"/></g>
      <path class="km km-normal" d="M100 139 Q110 146 120 139"/>
      <path class="km km-tired" d="M100 142 Q105 139 110 142 Q115 145 120 142"/>
      <path class="km km-happy" d="M97 136 Q110 153 123 136 Q110 145 97 136 Z"/>
      <circle class="km km-puz" cx="117" cy="141" r="4.5"/>
      <path class="kap-sweat" d="M190 50 q9 13 9 19 a9 9 0 1 1 -18 0 q0 -6 9 -19"/>
    </svg>
  </div>
  <div class="p-meter"><i></i></div>
</div></div></div>

<!-- S2 (b): context = chat record + memory file, re-read every time -->
<div class="fs-scene p2"><div class="fs-pillrow"><span class="fs-tag">5.1</span></div><div class="fs-center"><div class="fs-fit">
  <svg class="p-spin" width="52" height="52" viewBox="0 0 54 54" aria-hidden="true"><path d="M27 6 a21 21 0 1 1 -15 6.4" fill="none" stroke="#146856" stroke-width="5" stroke-linecap="round"/><path d="M4 15 l13 -3 -4 12 z" fill="#146856"/></svg>
  <div class="p-shelf"><div class="p-shelf-items">
    <svg width="96" height="88" viewBox="0 0 92 86" aria-hidden="true"><rect x="14" y="18" width="60" height="46" rx="6" fill="#fff" stroke="#b9cdc0" stroke-width="2.5" transform="rotate(-5 44 41)"/><rect x="18" y="12" width="60" height="46" rx="6" fill="#fff" stroke="#b9cdc0" stroke-width="2.5" transform="rotate(3 48 35)"/><rect x="16" y="22" width="60" height="46" rx="6" fill="#fff" stroke="#8aa79a" stroke-width="2.5"/><path d="M30 38 h32 M30 49 h22" stroke="#c9d8cf" stroke-width="5" stroke-linecap="round"/></svg>
    <span class="p-file"><span class="tab"></span>MEMORY.md</span>
  </div></div>
</div></div></div>

<!-- S3 (c-1): a sentence splits into token blocks; context + reply both counted -->
<div class="fs-scene p3"><div class="fs-pillrow"><span class="fs-tag">5.1</span></div><div class="fs-center"><div class="fs-fit">
  <div class="p-tokbar">
    <div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div><div class="p-tok"></div>
  </div>
  <div class="p-row p3b">
    <svg width="72" height="66" viewBox="0 0 92 86" aria-hidden="true"><rect x="14" y="18" width="60" height="46" rx="6" fill="#fff" stroke="#b9cdc0" stroke-width="2.5" transform="rotate(-5 44 41)"/><rect x="18" y="12" width="60" height="46" rx="6" fill="#fff" stroke="#b9cdc0" stroke-width="2.5" transform="rotate(3 48 35)"/><rect x="16" y="22" width="60" height="46" rx="6" fill="#fff" stroke="#8aa79a" stroke-width="2.5"/><path d="M30 38 h32 M30 49 h22" stroke="#c9d8cf" stroke-width="5" stroke-linecap="round"/></svg>
    <span class="p-plus">+</span>
    <svg width="42" height="54" viewBox="0 0 40 52" aria-hidden="true"><rect x="3" y="3" width="34" height="46" rx="5" fill="#fff" stroke="#8aa79a" stroke-width="2.5"/><path d="M11 18 h18 M11 28 h12" stroke="#c9d8cf" stroke-width="4.5" stroke-linecap="round"/></svg>
  </div>
</div></div></div>

<!-- S4 (c-2): PC usage display -->
<div class="fs-scene p4"><div class="fs-pillrow"><span class="fs-tag">5.1</span></div><div class="fs-center"><div class="fs-fit">
  <div class="p-card p-pc">
    <div class="p-pc-top"><i></i><i></i><i></i></div>
    <div class="p-line" style="width:88%"></div>
    <div class="p-line" style="width:72%"></div>
    <div class="p-flow">
      <div class="grp in-grp"><div style="display:flex;gap:4px"><div class="p-mini"></div><div class="p-mini"></div><div class="p-mini"></div><div class="p-mini"></div></div><span class="lab in">in</span></div>
      <div class="grp out-grp"><div class="p-mini"></div><span class="lab out">out</span></div>
    </div>
    <div class="p-usage"><span class="in">220.4k in</span> / <span class="out">765 out</span></div>
  </div>
</div></div></div>

<!-- S5 (d): scroll grows; each re-read costs more coins -->
<div class="fs-scene p5"><div class="fs-pillrow"><span class="fs-tag">5.1</span></div><div class="fs-center"><div class="fs-fit">
  <div class="p-scrollwrap">
    <div class="p-scroll"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ===== fullscreen explainer engine (same as v13 manual-motion):
   one unit = .fsstage; scenes switched discretely; telop pinned to its
   tallest text; ONE unified scale per unit from every scene's final-state
   size (cap 1.3; telop never scaled); plays only while on screen;
   FS_DURATION_SCALE = 2 (all durations 2x). Reduced motion: final scene
   shown statically. ===== */
(function(){
  if(!window.gsap) return;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SCALE_MAX = 1.3;
  var FS_DURATION_SCALE = 2.0;
  function createUnit(st, cfg){
    st.classList.add("fs-live");
    function Q(s){ return st.querySelector(s); }
    function QA(s){ return Array.prototype.slice.call(st.querySelectorAll(s)); }
    var tel = Q(".fs-telop");
    function setTel(t){ tel.textContent = t; scheduleFit(); }
    function pinTelopHeight(){
      var cur = tel.textContent, max = 0, i, h;
      tel.style.minHeight = "";
      for(i = 0; i < cfg.telopTexts.length; i++){
        tel.textContent = cfg.telopTexts[i];
        h = tel.offsetHeight; if(h > max) max = h;
      }
      tel.textContent = cur;
      if(max) tel.style.minHeight = max + "px";
    }
    function fitAll(){
      pinTelopHeight();
      st.classList.add("fs-measuring");
      void st.offsetHeight;
      var s = SCALE_MAX;
      QA(".fs-scene").forEach(function(sc){
        var fit = sc.querySelector(".fs-fit"); if(!fit) return;
        var ctr = sc.querySelector(".fs-center");
        var aw = ctr ? ctr.clientWidth : sc.clientWidth, ah = ctr ? ctr.clientHeight : sc.clientHeight;
        var ch = fit.offsetHeight, cw = 0, i, kid;
        for(i = 0; i < fit.children.length; i++){
          kid = fit.children[i].offsetWidth; if(kid > cw) cw = kid;
        }
        if(aw && ah && cw && ch) s = Math.min(s, ah / ch, aw / cw);
      });
      st.classList.remove("fs-measuring");
      QA(".fs-fit").forEach(function(f){
        f.style.transform = s !== 1 ? "scale(" + s.toFixed(4) + ")" : "";
      });
      st.setAttribute("data-fsscale", s.toFixed(3));
      return s;
    }
    var fitQueued = false;
    function scheduleFit(){
      if(fitQueued) return; fitQueued = true;
      requestAnimationFrame(function(){ fitQueued = false; fitAll(); });
    }
    window.addEventListener("resize", scheduleFit);
    window.addEventListener("orientationchange", scheduleFit);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
    function show(id){
      QA(".fs-scene").forEach(function(sc){ sc.classList.toggle("on", sc.classList.contains(id)); });
      scheduleFit();
    }
    var tl = gsap.timeline({repeat: reduced ? 0 : -1, repeatDelay: 3});
    tl.timeScale(1 / FS_DURATION_SCALE);
    cfg.build(tl, {Q:Q, QA:QA, show:show, setTel:setTel});
    tl.pause(0); st._tl = tl;
    fitAll();
    if(reduced){
      tl.progress(1); show(cfg.finalScene);
      gsap.set(QA("." + cfg.finalScene + " *"), {opacity:1});
      setTel(cfg.finalTelop); fitAll(); return;
    }
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) tl.play(); else tl.pause(); }); }, {threshold:.25}).observe(st);
    } else tl.play();
  }

  /* ================= 5.1 prototype: picture-only stage, telop is the only text ================= */
  var T = [
    "1つのチャットが長くなると、応答の質が下がり、トークンの消費も増えます。理由は、返信を作る仕組みにあります",
    "コンテキスト＝返信で参照する情報全体。このチャットの記録とメモリーファイルが含まれ、返信のたびに最初から読み直します",
